name: Tag and start release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable package version to release
        required: true
        default: "3.0.0"
        type: string
      expected_sha:
        description: Tested main commit expected by the release script
        required: false
        default: ""
        type: string

concurrency:
  group: tag-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require the requested tested commit
        run: |
          if [ -n "$EXPECTED_SHA" ] && [ "$EXPECTED_SHA" != "$GITHUB_SHA" ]; then
            echo "Main advanced after release preparation; expected $EXPECTED_SHA, got $GITHUB_SHA." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate package metadata before creating the tag
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.check_release import check_release

          check_release(Path.cwd(), "v" + os.environ["RELEASE_VERSION"])
          PY
      - name: Require successful main CI for this exact commit
        run: |
          conclusion="$(gh run list --workflow ci.yml --branch main --commit "$GITHUB_SHA" --event push --limit 1 --json conclusion --jq '.[0].conclusion')"
          if [ "$conclusion" != success ]; then
            echo "The latest main CI run for $GITHUB_SHA must succeed before tagging (got: $conclusion)." >&2
            exit 1
          fi
      - name: Create the annotated release tag
        run: |
          tag="v${RELEASE_VERSION}"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" "$GITHUB_SHA" -m "Release $RELEASE_VERSION"
            git push origin "refs/tags/$tag"
          fi
      - name: Start publication from the tag
        # GITHUB_TOKEN tag pushes do not trigger another push workflow. Explicit
        # workflow dispatch does, and the release workflow validates the tag again.
        run: gh workflow run release.yml --ref "v${RELEASE_VERSION}"
