<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Homoglyph and default-ignorable input hardening guide</title>
  <desc id="desc">A visual guide showing how lookalike script characters and invisible default-ignorable characters can alter text integrity before LLM prompt assembly.</desc>
  <rect width="920" height="420" fill="#f8fafc"/>
  <rect x="24" y="24" width="872" height="372" rx="12" fill="#ffffff" stroke="#cbd5e1"/>

  <text x="52" y="68" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Text can look ordinary while carrying different code points</text>
  <text x="52" y="96" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">The sanitizer normalizes, removes invisible controls, flags suspicious shapes, and reports stable reason codes.</text>

  <rect x="52" y="128" width="248" height="204" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="76" y="160" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">1. Homoglyph spoof</text>
  <text x="76" y="194" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0f172a">Visual word: paypal</text>
  <text x="76" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#334155">p + U+0430 + y + p + U+0430 + l</text>
  <text x="76" y="260" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">Latin letters mixed with Cyrillic lookalikes can bypass plain string checks.</text>
  <rect x="76" y="286" width="196" height="28" rx="6" fill="#fee2e2"/>
  <text x="88" y="305" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#991b1b">confusable_mixed_script</text>

  <rect x="336" y="128" width="248" height="204" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="360" y="160" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">2. Invisible markers</text>
  <text x="360" y="194" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0f172a">Visible word: payload</text>
  <text x="360" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#334155">pay + U+200B + load</text>
  <text x="360" y="260" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">Zero-width and default-ignorable code points can hide separators or payload bytes.</text>
  <rect x="360" y="286" width="164" height="28" rx="6" fill="#dbeafe"/>
  <text x="372" y="305" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1e40af">default_ignorable</text>

  <rect x="620" y="128" width="248" height="204" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="644" y="160" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">3. Encoded shapes</text>
  <text x="644" y="194" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0f172a">Text as byte-like data</text>
  <text x="644" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#334155">49 67 6E 6F 72 65 ...</text>
  <text x="644" y="260" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">Long base64 or hex-shaped blobs are flagged as payload shapes, not decoded intent.</text>
  <rect x="644" y="286" width="86" height="28" rx="6" fill="#dcfce7"/>
  <text x="656" y="305" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#166534">hex_blob</text>

  <path d="M 302 230 C 318 230 320 230 336 230" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 586 230 C 602 230 604 230 620 230" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="52" y="370" font-family="Inter, Arial, sans-serif" font-size="14" fill="#334155">Use the report for logs and enforcement: removed_counts, flagged_counts, reason_codes, and compact_report().</text>
</svg>
