<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">llm-input-hardening text integrity pipeline</title>
  <desc id="desc">Untrusted user text, retrieved passages, tool arguments, and JSON string leaves flow through deterministic input hardening, producing clean text, structured reports, and allow, quarantine, or reject decisions before prompt, model, and tool layers.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#06212a" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#0f7c86"/>
    </marker>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbfc"/>
      <stop offset="1" stop-color="#eef7f4"/>
    </linearGradient>
    <linearGradient id="core" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1f9aa0"/>
      <stop offset="1" stop-color="#136f63"/>
    </linearGradient>
    <style>
      .bg { fill: url(#bg); }
      .rail { fill: #ffffff; stroke: #c7d8dd; stroke-width: 2; }
      .panel { fill: #ffffff; stroke: #b9ccd1; stroke-width: 2; }
      .soft { fill: #f4faf9; stroke: #c4d7d2; stroke-width: 2; }
      .warning { fill: #fff7e6; stroke: #d9a441; stroke-width: 2; }
      .reject { fill: #fff0f0; stroke: #d86b6b; stroke-width: 2; }
      .title { fill: #12313a; font: 700 26px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 3px; }
      .label { fill: #16343d; font: 700 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .body { fill: #435b63; font: 500 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .small { fill: #5f747b; font: 500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .tiny { fill: #6c7e84; font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .accent { fill: #0f7c86; }
      .ok { fill: #1f9f73; }
      .warn { fill: #c47f12; }
      .fail { fill: #c64f4f; }
      .line { fill: none; stroke: #0f7c86; stroke-width: 3; stroke-dasharray: 10 12; marker-end: url(#arrow); }
      .plain-line { fill: none; stroke: #9db6bc; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="560" rx="28"/>

  <text class="title accent" x="76" y="72">UNTRUSTED TEXT</text>
  <text class="title accent" x="640" y="72">DETERMINISTIC PREFLIGHT</text>
  <text class="title accent" x="1196" y="72">PROMPT BOUNDARY</text>

  <g filter="url(#shadow)">
    <rect class="panel" x="58" y="112" width="470" height="66" rx="16"/>
    <text class="label" x="92" y="153">user prompt</text>
    <text class="tiny" x="338" y="153">chat input</text>

    <rect class="panel" x="58" y="196" width="470" height="66" rx="16"/>
    <text class="label" x="92" y="237">RAG passage</text>
    <text class="tiny" x="338" y="237">retrieved text</text>

    <rect class="panel" x="58" y="280" width="470" height="66" rx="16"/>
    <text class="label" x="92" y="321">tool argument</text>
    <text class="tiny" x="338" y="321">execution-adjacent</text>

    <rect class="panel" x="58" y="364" width="470" height="66" rx="16"/>
    <text class="label" x="92" y="405">JSON string leaf</text>
    <text class="tiny" x="338" y="405">nested payload</text>
  </g>

  <path class="line" d="M548 145 C615 145 628 206 690 226"/>
  <path class="line" d="M548 229 C615 229 630 238 690 246"/>
  <path class="line" d="M548 313 C615 313 630 274 690 266"/>
  <path class="line" d="M548 397 C617 382 632 312 690 286"/>

  <g filter="url(#shadow)">
    <rect x="676" y="116" width="340" height="336" rx="24" fill="#ffffff" stroke="#b9ccd1" stroke-width="2"/>
    <circle cx="846" cy="228" r="88" fill="url(#core)"/>
    <path d="M846 164 L908 190 V230 C908 280 878 312 846 326 C814 312 784 280 784 230 V190 Z" fill="#ffffff" opacity="0.94"/>
    <path d="M808 234 H884" stroke="#136f63" stroke-width="10" stroke-linecap="round"/>
    <path d="M808 258 H864" stroke="#1f9aa0" stroke-width="10" stroke-linecap="round"/>
    <text class="label" x="722" y="366">llm-input-hardening</text>
    <text class="small" x="724" y="396">normalize - remove - flag</text>
    <text class="small" x="724" y="420">report reason codes</text>
  </g>

  <g>
    <rect class="soft" x="712" y="462" width="120" height="36" rx="8"/>
    <text class="tiny" x="730" y="485">NFC/NFKC</text>
    <rect class="soft" x="846" y="462" width="130" height="36" rx="8"/>
    <text class="tiny" x="866" y="485">bidi/ZWSP</text>
    <rect class="soft" x="990" y="462" width="138" height="36" rx="8"/>
    <text class="tiny" x="1008" y="485">confusables</text>
  </g>

  <path class="line" d="M1024 236 C1092 236 1104 146 1172 142"/>
  <path class="line" d="M1024 260 C1092 260 1104 258 1172 258"/>
  <path class="line" d="M1024 284 C1092 284 1104 370 1172 374"/>

  <g filter="url(#shadow)">
    <rect class="soft" x="1192" y="100" width="346" height="88" rx="16"/>
    <text class="label" x="1228" y="138">clean text</text>
    <text class="small ok" x="1228" y="166">safe to interpolate downstream</text>

    <rect class="warning" x="1192" y="216" width="346" height="88" rx="16"/>
    <text class="label" x="1228" y="254">structured report</text>
    <text class="small warn" x="1228" y="282">counts, spans, reason codes</text>

    <rect class="reject" x="1192" y="332" width="346" height="88" rx="16"/>
    <text class="label" x="1228" y="370">decision signal</text>
    <text class="small fail" x="1228" y="398">allow / quarantine / reject</text>
  </g>

  <g>
    <rect class="rail" x="1176" y="452" width="362" height="62" rx="14"/>
    <text class="small" x="1206" y="478">then prompt templates, guardrails,</text>
    <text class="small" x="1206" y="500">models, and tools</text>
  </g>

  <g>
    <line class="plain-line" x1="72" y1="528" x2="500" y2="528"/>
    <text class="small" x="524" y="534">scope: text integrity only; semantic jailbreak intent stays out of scope</text>
  </g>
</svg>
